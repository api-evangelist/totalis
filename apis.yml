aid: totalis
name: Totalis
description: >-
  Totalis (totalis.trade), operated by UCALLEDIT, Inc., is a Y Combinator-backed
  (Spring 2026) derivatives layer for prediction markets. Users pick two to five
  outcomes across underlying venues like Kalshi and Polymarket and combine them
  into a single parlay; market makers compete to price the trade through a
  request-for-quote (RFQ) system, and positions settle in non-custodial Solana
  vaults with USDC collateral. The Totalis RFQ API is a documented REST + SSE
  surface with scoped API keys, a WebSocket for post-trade events, and
  HMAC-signed webhooks — covering markets, quote requests, parlays, portfolio,
  funds, and market-maker flows.
